name: Docker Image Build
on:
  push:
    branches: [ "main" ]
    tags:
      - '*'
  pull_request:
    branches: [ "main" ]

# The registry login below uses a PAT, so the workflow token only needs to read
# the repository.
permissions:
  contents: read

# A pull request build that has been superseded is not worth a runner. Tagged
# builds publish, so they are left to finish.
concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Git Describe
      run: git describe --tags --abbrev=8 --dirty --always --long > backend/git-describe.txt
    - name: Docker Meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/rohitkumbhar/surmai
    - name: Login to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_PACKAGE_PAT }}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        # The dependency layers, pnpm install and go mod download, change only
        # when a lockfile does, so most of this build can come from the cache
        # that the previous run left behind.
        cache-from: type=gha
        cache-to: type=gha,mode=max
