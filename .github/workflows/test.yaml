name: Tests
on:
  push:
    branches: [ "main" ]
  pull_request:

# Every job here checks out the repository and uploads artifacts; neither needs
# write access to anything.
permissions:
  contents: read

# A second push to the same branch makes the run in progress pointless, and
# the three jobs here hold runners for several minutes each.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install tools from mise.toml
        uses: jdx/mise-action@v5
      # Almost all of this job is compiling: coverage.sh measures across every
      # package, so each test binary is built with the whole dependency tree
      # instrumented, and -race builds its own copy of that again. Keyed on
      # go.sum, so it is written once per dependency change and read after.
      - name: Cache the Go build and module caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-test-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}
          restore-keys: |
            go-test-${{ runner.os }}-
      - name: Run tests with coverage
        # The argument is the minimum total coverage. Raise it as coverage improves.
        run: backend/scripts/coverage.sh 70
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: backend/coverage.out

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install tools from mise.toml
        uses: jdx/mise-action@v5
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The suite starts the backend with `go run`, which compiles it first.
      # Separate from the test job's cache because that one is built with
      # -race and coverage instrumentation, so the two share almost nothing.
      - name: Cache the Go build and module caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-e2e-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}
          restore-keys: |
            go-e2e-${{ runner.os }}-
      # The browsers are deliberately not cached. Measured over six runs the
      # install takes 23 to 32 seconds, and a cache hit still has to install
      # the system libraries onto a fresh runner, which is 18 of those
      # seconds, so restoring 400MB saves about two seconds and competes with
      # the Go caches for the repository's cache budget.
      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium firefox
      - name: Run the suite
        run: pnpm test:e2e
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report

  frontend:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install tools from mise.toml
        uses: jdx/mise-action@v5
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm exec tsc -b
      - name: Run tests with coverage
        # Minimum coverage is enforced by coverage.thresholds in vite.config.ts
        run: pnpm test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: coverage
