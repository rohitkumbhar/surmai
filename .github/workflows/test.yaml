name: Tests
on:
  push:
    branches: [ "main" ]
  pull_request:

# Every job here checks out the repository and uploads artifacts; neither needs
# write access to anything.
permissions:
  contents: read

jobs:
  backend:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install tools from mise.toml
        uses: jdx/mise-action@v5
      - name: Run tests with coverage
        # The argument is the minimum total coverage. Raise it as coverage improves.
        run: backend/scripts/coverage.sh 70
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: backend/coverage.out

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install tools from mise.toml
        uses: jdx/mise-action@v5
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium firefox
      - name: Run the suite
        run: pnpm test:e2e
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report

  frontend:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install tools from mise.toml
        uses: jdx/mise-action@v5
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm exec tsc -b
      - name: Run tests with coverage
        # Minimum coverage is enforced by coverage.thresholds in vite.config.ts
        run: pnpm test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: coverage
